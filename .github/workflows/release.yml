name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  macos:
    name: Build signed macOS packages
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v5
        with:
          path: build/download-cache
          key: toolchain-macos-${{ hashFiles('toolchain/manifest.json') }}
      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Import Apple signing identity
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: scripts/import-apple-certificate.sh
      - name: Configure Apple notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          xcrun notarytool store-credentials yt-downloader-notary
          --apple-id "$APPLE_ID"
          --password "$APPLE_APP_PASSWORD"
          --team-id "$APPLE_TEAM_ID"
      - name: Build, sign, and notarize
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_NOTARY_PROFILE: yt-downloader-notary
        run: scripts/build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-packages
          path: build/bin/YT-Downloader-macOS-*.zip
          if-no-files-found: error

  windows:
    name: Build Windows package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v5
        with:
          path: build/download-cache
          key: toolchain-windows-${{ hashFiles('toolchain/manifest.json') }}
      - run: choco install jq zip --no-progress -y
      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build package
        run: scripts/build-windows.sh
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: build/bin/YT-Downloader-Windows.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - macos
      - windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-package*'
          path: release
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --generate-notes --verify-tag
